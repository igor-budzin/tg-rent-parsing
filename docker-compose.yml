services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://tg_rent:tg_rent@postgres:5432/tg_rent
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tg_rent
      POSTGRES_PASSWORD: tg_rent
      POSTGRES_DB: tg_rent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tg_rent -d tg_rent"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
